# Teste Integral 3: ISO instaladora -> QCOW2 comprimido -> VM restaurada.
# Nome de arquivo e check mantidos por compatibilidade com regras de branch.
# Sem push, workflow_dispatch, schedule, workflow_call ou outros gatilhos.
name: "Integral 3 - Compressed QCOW2 persistence"

on:
  pull_request:
    branches:
      - homolog
      - main
    types:
      - opened
      - synchronize
      - reopened

# Somente a revisao mais recente de cada PR consume horas de runner.
concurrency:
  group: integral-3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integral-3-iso-workspace-persistence:
    if: ${{ github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: integral-3-iso-workspace-persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - name: Checkout do merge proposto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validar contrato e compilacao antes do teste caro
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/integral-3-iso-persistence.sh
          go vet ./...

      - name: Preparar KVM, Libvirt e instalador Debian
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]] || { echo "::error::/dev/kvm missing: no mock fallback"; exit 1; }
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libvirt-daemon-system libvirt-clients qemu-system-x86 qemu-utils \
            virtinst dnsmasq-base genisoimage acl openssl \
            libguestfs-tools fuse3 ca-certificates curl kmod e2fsprogs
          sudo systemctl start libvirtd.service
          sudo setfacl -m "u:$(id -un):rw" /run/libvirt/libvirt-sock
          if ! virsh -c qemu:///system net-info default | grep -Eq 'Active:[[:space:]]+yes'; then
            sudo virsh -c qemu:///system net-start default
          fi
          virsh -c qemu:///system net-info default

      - name: Teste funcional - kernel privado em guestmount real
        shell: bash
        run: |
          set -euo pipefail
          command -v depmod
          INSULA_GUESTFS_FUNCTIONAL=1 go test -tags integration -count=1 -timeout 15m \
            -run '^TestFunctionalGuestfsPrivateKernelMount$' -v ./insulavm

      - name: Teste Integral 3 - Mini ISO, QCOW2 comprimido e persistencia
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/integral-3-iso-persistence.sh

      - name: Diagnostico do host em falha
        if: failure()
        shell: bash
        run: |
          mkdir -p data/integral-3-ci/diagnostic
          virsh -c qemu:///system list --all \
            > data/integral-3-ci/diagnostic/domains.txt 2>&1 || true
          virsh -c qemu:///system net-dhcp-leases default \
            > data/integral-3-ci/diagnostic/leases.txt 2>&1 || true
          sudo journalctl -u libvirtd -u virtqemud -u virtlogd \
            --since '3 hours ago' --no-pager \
            > data/integral-3-ci/diagnostic/libvirt-journal.log 2>&1 || true

      - name: Publicar logs de host e do guest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integral-3-iso-workspace-evidencias
          path: |
            data/integral-3-ci/diagnostic/
            data/integral-3-ci/state/logs/
          if-no-files-found: warn
          retention-days: 7
