name: Go tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve module dependencies
        run: |
          go mod tidy
          echo "INSULAVM_MOD_BASE64=$(base64 -w0 go.mod)"
          echo "INSULAVM_SUM_BASE64=$(base64 -w0 go.sum)"
      - name: Validate and test
        run: |
          go vet ./...
          go test -race ./...

      - name: Compile example from an independent Go module
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          go mod init example.com/insulavm-consumer
          go mod edit -replace "github.com/ahhvahh/InsulaVM=$GITHUB_WORKSPACE"
          cp "$GITHUB_WORKSPACE/examples/go-library/main.go" ./main.go
          go mod tidy
          go test ./...
