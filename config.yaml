# Global InsulaVM settings. Paths are resolved relative to this file.
# Created on demand: ./data/profiles, ./data/runs and ./data/logs
storage:
  root: ./data
  profiles: profiles
  runs: runs
  logs: logs
  # SQLite shared by CLI and imported Go library; no credentials stored here.
  database: insula.db

# Single destination directory INSIDE every VM, shared across all imports
# and used as the default directory for commands and Actions.
# This is a guest Linux path, not a path on the host.
guest:
  destination: /tmp/insulavm/workspace

virtualization:
  provider: kvm
  libvirt_uri: qemu:///system
  # For libvirt qemu:///system hosts where QEMU cannot access private files:
  # install 'acl' and set this to the UID shown in the Libvirt error,
  # e.g. 'as uid:64055, gid:64055'. Never configure 0/root.
  # qemu_uid: 64055
  network: default
  default_disk_gb: 8

# SSH user defaults to insula; every managed VM receives its own keys.
# Keys/known_hosts need separate configuration ONLY for unmanaged external hosts.
# Passwords and private-key contents must NEVER be stored in YAML.
# Fresh per-VM SSH keys are generated automatically by Cloud-Init provisioning.
ssh:
  user: insula
  connect_timeout_seconds: 60
  # For trusted disposable VMs: sudo -n without a password.
  # Set disabled to disallow sudo (preferred when executing untrusted code).
  sudo_mode: passwordless
